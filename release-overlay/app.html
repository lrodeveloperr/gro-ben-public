function resolvedAppShareUrl(){
  if(APP_SHARE_URL){
    return APP_SHARE_URL;
  }

  try{
    const url=new URL(location.href);
    url.search='';
    url.hash='';

    if(url.protocol==='http:'||url.protocol==='https:'){
      return url.href;
    }
  }catch(_){}

  return '';
}

function fallbackCopyShareUrl(url){
  if(!url)return false;

  const input=document.createElement('textarea');
  input.value=url;
  input.setAttribute('readonly','');
  input.style.position='fixed';
  input.style.opacity='0';
  document.body.appendChild(input);
  input.select();

  let copied=false;
  try{copied=document.execCommand('copy');}catch(_){copied=false;}
  input.remove();
  return copied;
}

async function shareApp(){
  closeDrawer();
  const url=resolvedAppShareUrl();

  if(!url){
    toast(tr('share.unavailable'));
    return;
  }

  const payload={title:tr('app.title'),text:tr('share.text'),url};

  try{
    if(typeof navigator.share==='function'){
      await navigator.share(payload);
      return;
    }

    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(url);
      toast(tr('share.copied'));
      return;
    }

    if(fallbackCopyShareUrl(url)){
      toast(tr('share.copied'));
      return;
    }

    toast(tr('share.unavailable'));
  }
  catch(err){
    if(err?.name==='AbortError')return;
    console.error(err);
    toast(tr('share.unavailable'));
  }
}

async function prepareHistoryImport(file){pendingHistoryImport=null;if(!durableReady){storageAlert(tr('storage.temporarySession'));return;}try{if(!file||file.size>HISTORY_IMPORT_MAX_BYTES)throw R.err(R.ERROR.FILE_TOO_LARGE);openModal(`<div class="modal-head"><h2>${tr('history.importProgress')}</h2>${closeButton()}</div><div class="notice info" role="status" aria-live="polite" aria-busy="true">${tr('history.importProgress')}</div><button data-action="cancel-history-import" class="btn secondary full">${tr('common.cancel')}</button>`,'history-import-progress');let raw=JSON.parse(await file.text());if(R.isAcceptedEncryptedTransferFormat(raw.format)){closeModal();openModal(`<div class="modal-head"><h2>${tr('history.encryptedBackup')}</h2>${closeButton()}</div><label>${tr('history.passphrase')}</label><input id="historyImportPassphrase" type="password"><button data-action="confirm-encrypted-history-import" class="btn full">${tr('history.importBackup')}</button>`,'history-import-encrypted');pendingHistoryImport={encryptedRaw:raw,fileSize:file.size};return;}const envelope=await R.parseHistoryBackup(raw,{catalogById:CATALOG_BY_ID}),plan=await R.planHistoryImport(envelope,state.history,{fileSize:file.size,catalogById:CATALOG_BY_ID});pendingHistoryImport=plan;openModal(importReviewHtml(plan),'history-import-review');}catch(e){pendingHistoryImport=null;console.error(e);closeModal();toast(userVisibleError(e));}}

function rebuildRecentSuggestionsFromHistory(){const stores=[],items=[];for(const tx of state.history||[]){if(tx.storeDisplayName||tx.store)stores.push(tx.storeDisplayName||tx.store);for(const i of tx.items||[])items.push({name:i.name||'',catalogItemId:i.catalogItemId||null,systemNameKey:i.systemNameKey||null,category:i.category||'other'});}state.recentStores=[...new Map(stores.map(v=>{const n=R.normalizeStore(v);return [n.storeNormalizedKey,n.storeDisplayName]}).filter(x=>x[0])).values()].slice(0,40);state.recentItems=items.filter(x=>x.name||x.catalogItemId).slice(0,80);}
function correctionWicRows(date,item){const rows=activeWicAllowanceRows(date),keys=new Set(rows.map(x=>x.card.id+'::'+x.allowance.id));for(const al of item?.allocations||[]){if(al.type!=='WIC'||!al.cardId||!al.allowanceId)continue;const card=state.wicCards.find(c=>c.id===al.cardId),allowance=card?.allowances?.find(a=>a.id===al.allowanceId);if(card&&allowance&&!keys.has(card.id+'::'+allowance.id)){rows.push({card,allowance,restoredForCorrection:true});keys.add(card.id+'::'+allowance.id);}}return rows;}
function appendCorrectionAuditEvents(before,after,effectiveDate,txId,itemId,recordedAt){const normalizeNewEvents=(previous,current)=>{const existingIds=new Set((previous||[]).map(event=>event.id));for(const event of current||[]){if(existingIds.has(event.id)||event.transactionId!==txId)continue;event.transactionId=txId;event.itemId=event.itemId??itemId??null;event.recordedAt=recordedAt;event.date=event.date||effectiveDate;event.effectiveDate=event.effectiveDate||event.date||effectiveDate;}};for(const card of after.snapCards||[]){const prev=(before.snapCards||[]).find(x=>x.id===card.id);if(prev)normalizeNewEvents(prev.transactions,card.transactions);}for(const card of after.wicCards||[]){const prevCard=(before.wicCards||[]).find(x=>x.id===card.id);for(const allowance of card.allowances||[]){const prev=prevCard?.allowances?.find(x=>x.id===allowance.id);if(prev)normalizeNewEvents(prev.transactions,allowance.transactions);}}}
function historyFundingFromAllocations(item){const rows=item.allocations||[],snap=rows.find(a=>a.type==='SNAP'),cash=rows.find(a=>a.type==='CASH'),wic=rows.find(a=>a.type==='WIC');if(wic){const funding={mode:'WIC',wicCardId:wic.cardId||'',allowanceId:wic.allowanceId||'',wicQuantity:wic.quantity,wicUnit:wic.unit};if(cash)funding.remainderType='CASH';else if(snap){funding.remainderType='SNAP';funding.remainderSnapCardId=snap.cardId||'';}return funding;}if(snap&&cash)return {mode:'SPLIT',snapCardId:snap.cardId||'',split:{snapCents:R.strictMoney(snap.amountCents,{path:'correction.snapCents'}),cashCents:R.strictMoney(cash.amountCents,{path:'correction.cashCents'})}};if(snap)return {mode:'SNAP',snapCardId:snap.cardId||''};if(cash)return {mode:'CASH'};return {mode:'UNSURE',needsResolution:true};}

function wicRecordedUnitKey(unit){return unit?String(unit):REPORT_UNKNOWN_WIC_UNIT;}
function formatRecordedWicQty(value,unitKey){if(unitKey===REPORT_UNKNOWN_WIC_UNIT)return sensitive(`${formatNumber(value)} ${tr('common.unknown')}`);return sensitiveQty(value,unitKey);}
function formatSignedRecordedWicQty(value,unitKey){const n=Number(value||0),sign=n>0?'+':n<0?'−':'';if(unitKey===REPORT_UNKNOWN_WIC_UNIT)return sensitive(`${sign}${formatNumber(Math.abs(n))} ${tr('common.unknown')}`);return sensitive(`${sign}${formatQty(Math.abs(n),unitKey)}`);}
function wicAllocationTotalsByRecordedUnit(rows,cardId,allowanceId){const totals=new Map();for(const r of rows||[]){if(r.fundingType!=='WIC'||r.cardId!==cardId||r.allowanceId!==allowanceId||r.wicQuantity==null)continue;const unit=wicRecordedUnitKey(r.wicUnit);totals.set(unit,(totals.get(unit)||0)+Number(r.wicQuantity||0));}return totals;}
function wicCheckoutLedgerTotalsByUnit(allowance){const totals=new Map();for(const event of allowance?.transactions||[]){const delta=Number(event?.delta);if(event?.kind!=='CHECKOUT'||!Number.isFinite(delta)||delta>=0)continue;const unit=wicRecordedUnitKey(event.unit);totals.set(unit,(totals.get(unit)||0)+Math.abs(delta));}return totals;}
function formatWicUnitTotals(totals){if(!totals?.size)return tr('reports.noActivity');return [...totals.entries()].map(([unit,qty])=>formatRecordedWicQty(qty,unit)).join(' · ');}
function wicCurrentUnitReconciliation(allowance,allocationRows,cardId){const unit=allowance?.unit||'each',unitKey=wicRecordedUnitKey(unit),events=allowance?.transactions||[];let epochStart=0,transitionDate='';for(let i=0;i<events.length;i++){const event=events[i];if(event?.previousUnit&&event?.unit&&event.previousUnit!==event.unit){epochStart=i+1;transitionDate=event.date||transitionDate;}}const checkoutEvents=events.slice(epochStart).filter(event=>event?.kind==='CHECKOUT'&&wicRecordedUnitKey(event.unit)===unitKey&&Number(event.delta)<0);let purchaseUse=checkoutEvents.reduce((sum,event)=>sum+Math.abs(Number(event.delta||0)),0);if(!checkoutEvents.length){purchaseUse=(allocationRows||[]).filter(r=>r.fundingType==='WIC'&&r.cardId===cardId&&r.allowanceId===allowance.id&&wicRecordedUnitKey(r.wicUnit)===unitKey&&(!transitionDate||r.date>=transitionDate)).reduce((sum,r)=>sum+Number(r.wicQuantity||0),0);}const starting=Number(allowance?.starting||0),remaining=Number(allowance?.remaining||0),adjustments=remaining-starting+purchaseUse;return {unitKey,starting,remaining,purchaseUse,adjustments};}

}</div>${hasOtherUnits?`<div class="report-current-note">${tr('reports.recordedUseByUnit')}: ${formatWicUnitTotals(historicalUse)}</div>`:''}<div class="report-current-note">${tr('reports.usedInScope')}: ${formatWicUnitTotals(scopeUse)}</div></div>`;}).join('');}
function groupReportMoney(data,key){const totals=new Map();if(reportFilters.funding==='ALL'){for(const i of data.knownItems){const k=i[key]||'';totals.set(k,(totals.get(k)||0)+Number(i.itemTotalCents||0));}}else{for(const a of data.allocations){if(a.amountCents==null)continue;const k=key==='category'?a.reportCategory:(a[key]||'');totals.set(k,(totals.get(k)||0)+Number(a.amountCents||0));}}return [...totals.entries()].sort((a,b)=>b[1]-a[1]);}

function reportCashPeriods(){const current=C.getCashBudgetStatus(state.cash),rows=[{id:state.cash.periodId,start:state.cash.start,end:state.cash.end,periodBudget:current.budget,spent:current.spent,remaining:current.remaining,overage:current.overage,status:current.status,current:true},...(state.cash.periodHistory||[]).map(p=>({...p,current:false}))];return rows.filter(p=>(!reportFilters.from||!p.end||p.end>=reportFilters.from)&&(!reportFilters.to||!p.start||p.start<=reportFilters.to));}
function cashPeriodStatusText(p){
  const budget=
    Number(
      p?.periodBudget ??
      p?.budget ??
      0

  if(budget<=0){

  }

      'reports.aboveBudgetBy',
      {

async function downloadBlob(name,blob){
 if(typeof window.GBTNativeShareFile==='function'){await window.GBTNativeShareFile(blob,name,blob.type||'application/octet-stream');return {shared:true};}
 if(window.ReactNativeWebView?.postMessage)throw R.err(R.ERROR.SHARE_FAILED,'nativeShareBridge');
 try{const file=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare?.({files:[file]})&&typeof navigator.share==='function'){await navigator.share({files:[file],title:name});return {shared:true};}}catch(e){if(e?.name==='AbortError')throw e;console.warn('Browser share failed; using download fallback.',e);}
 const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(_){}a.remove();},30000);return {shared:false};
}

    persist();
    renderSuggestions('store',e.target.value);
  }
  else if(e.target.id==='itemInput'){
    const d=ensureShopDraft();
    d.name=e.target.value;
    d.catalogItemId=null;
    d.systemNameKey=null;
    scheduleDraftPersistence('shop',d);
    renderSuggestions('item',e.target.value);
  }
  else if(e.target.id==='itemBrandInput'){
    const d=ensureShopDraft();d.brand=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='quantityInput'){
    const d=ensureShopDraft();d.quantityRaw=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='wicQtyInput'){
    const d=ensureShopDraft();d.wicQuantityRaw=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='historySearch'){
    historyFilters.query=e.target.value;
    clearTimeout(historySearchTimer);
    historySearchTimer=setTimeout(()=>{
      if(state.route!=='history')return;
      renderHistory();

      }

  }

}
