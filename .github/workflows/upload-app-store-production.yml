name: Upload App Store production build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD PRODUCTION BUILD to confirm use of live AdMob inventory
        required: true
        type: string
      expected_build_number:
        description: Enter the exact App Store build number approved by the owner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-app-store-production-upload
  cancel-in-progress: false

env:
  CI: "1"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_AD_PROFILE: production
  EXPO_PUBLIC_ADMOB_PUBLISHER_ID: "8054612600809568"
  EXPO_PUBLIC_IOS_ADMOB_APP_ID: ca-app-pub-8054612600809568~1748518282
  EXPO_PUBLIC_IOS_ADMOB_BANNER_ID: ca-app-pub-8054612600809568/3872496047
  EXPO_PUBLIC_BUILD_PROFILE: production
  SOURCE_ZIP: SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip
  SOURCE_ZIP_SHA256: 23d938c18df0e185e54946759a3075ef42ce2a6cbc3a0bff99b3a085387e4fcd
  SCHEME: SNAPEBTGroceryTrackerQA
  IOS_BUNDLE_ID: com.lateefrazaqoyetola.snapebtwictracker
  APP_STORE_ID: "6799562282"
  REMOVE_ADS_PRODUCT_ID: remove_ads_lifetime
  REMOVE_ADS_US_PRICE: "9.99"
  APPLE_TEAM_ID: 49SQ3XQ68Q
  MARKETING_VERSION: "1.0"
  ADMOB_PRODUCTION_APP_ID: ca-app-pub-8054612600809568~1748518282
  ADMOB_PRODUCTION_BANNER_ID: ca-app-pub-8054612600809568/3872496047

jobs:
  upload:
    name: Signed production iPhone build to App Store Connect
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    # Reuse the existing main-only App Store credential environment.
    # Typed workflow confirmation and the production-only validation gates
    # continue to protect live AdMob and App Store uploads.
    environment: app-store-internal

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Confirm production build
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.expected_build_number }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "UPLOAD PRODUCTION BUILD" ]]; then
            echo "Confirmation did not match UPLOAD PRODUCTION BUILD." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]]; then
            echo "The owner-approved build number is invalid." >&2
            exit 1
          fi
          [[ "$IOS_BUNDLE_ID" == "com.lateefrazaqoyetola.snapebtwictracker" ]]
          [[ "$IOS_BUNDLE_ID" != *.qa ]]
          [[ "$APP_STORE_ID" == "6799562282" ]]
          [[ "$APPLE_TEAM_ID" == "49SQ3XQ68Q" ]]
          [[ "$MARKETING_VERSION" == "1.0" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]

      - name: Verify Apple credentials, app record, and unused build number
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.expected_build_number }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing app-store-production environment secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cleanup() {
            rm -f "$key_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY
          chmod 600 "$key_path"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$key_path"
          grep -Fq -- '-----END PRIVATE KEY-----' "$key_path"

          jwt="$(ruby release-overlay/scripts/app-store-connect-jwt.rb \
            "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          authorization="Authorization: Bearer $jwt"

          app_response="$RUNNER_TEMP/app-store-app.json"
          bundle_response="$RUNNER_TEMP/app-store-bundle-id.json"
          iap_response="$RUNNER_TEMP/app-store-remove-ads-iap.json"
          iap_availability_response="$RUNNER_TEMP/app-store-remove-ads-availability.json"
          iap_territories_response="$RUNNER_TEMP/app-store-remove-ads-territories.json"
          iap_base_territory_response="$RUNNER_TEMP/app-store-remove-ads-base-territory.json"
          iap_price_response="$RUNNER_TEMP/app-store-remove-ads-price.json"
          prerelease_response="$RUNNER_TEMP/app-store-prerelease.json"
          build_page="$RUNNER_TEMP/app-store-build-page.json"
          build_versions="$RUNNER_TEMP/app-store-build-versions.txt"

          curl --fail-with-body --silent --show-error \
            -H "$authorization" \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_STORE_ID" \
            -o "$app_response"
          ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Unexpected App Store app ID." unless data.fetch("id") == ENV.fetch("APP_STORE_ID")
            actual = data.fetch("attributes").fetch("bundleId")
            abort "App Store bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$app_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" \
            --data-urlencode 'limit=1' \
            'https://api.appstoreconnect.apple.com/v1/bundleIds' \
            -o "$bundle_response"
          ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "The API key cannot access the registered bundle ID." if data.empty?
            actual = data.first.fetch("attributes").fetch("identifier")
            abort "Registered bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$bundle_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode "filter[productId]=$REMOVE_ADS_PRODUCT_ID" \
            --data-urlencode 'limit=2' \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_STORE_ID/inAppPurchasesV2" \
            -o "$iap_response"
          iap_id="$(ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Expected exactly one Remove Ads in-app purchase for this app." unless data.length == 1
            purchase = data.first
            attributes = purchase.fetch("attributes")
            product_id = attributes.fetch("productId")
            abort "Remove Ads product ID mismatch: #{product_id}" unless product_id == ENV.fetch("REMOVE_ADS_PRODUCT_ID")
            type = attributes.fetch("inAppPurchaseType")
            abort "Remove Ads must be NON_CONSUMABLE; found #{type}." unless type == "NON_CONSUMABLE"
            state = attributes.fetch("state")
            # The first IAP review screenshot must be captured from processed build 6.
            # All other IAP attributes are checked below and were verified in App Store Connect.
            allowed = %w[MISSING_METADATA READY_TO_SUBMIT WAITING_FOR_REVIEW IN_REVIEW PENDING_BINARY_APPROVAL APPROVED]
            abort "Remove Ads has an unexpected state: #{state}" unless allowed.include?(state)
            puts purchase.fetch("id")
          ' "$iap_response")"
          [[ -n "$iap_id" ]]

          curl --fail-with-body --silent --show-error \
            -H "$authorization" \
            "https://api.appstoreconnect.apple.com/v2/inAppPurchases/$iap_id/inAppPurchaseAvailability" \
            -o "$iap_availability_response"
          availability_id="$(ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Remove Ads availability is not configured." unless data
            puts data.fetch("id")
          ' "$iap_availability_response")"
          [[ -n "$availability_id" ]]
          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode 'limit=200' \
            "https://api.appstoreconnect.apple.com/v1/inAppPurchaseAvailabilities/$availability_id/availableTerritories" \
            -o "$iap_territories_response"
          ruby -rjson -e '
            territories = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Remove Ads is not available in the United States." unless territories.any? { |territory| territory.fetch("id") == "USA" }
          ' "$iap_territories_response"

          curl --fail-with-body --silent --show-error \
            -H "$authorization" \
            "https://api.appstoreconnect.apple.com/v1/inAppPurchasePriceSchedules/$iap_id/baseTerritory" \
            -o "$iap_base_territory_response"
          ruby -rjson -e '
            territory = JSON.parse(File.read(ARGV[0])).fetch("data").fetch("id")
            abort "Remove Ads base territory is #{territory}, expected USA." unless territory == "USA"
          ' "$iap_base_territory_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode 'filter[territory]=USA' \
            --data-urlencode 'fields[inAppPurchasePrices]=startDate,endDate,inAppPurchasePricePoint' \
            --data-urlencode 'fields[inAppPurchasePricePoints]=customerPrice' \
            --data-urlencode 'include=inAppPurchasePricePoint' \
            --data-urlencode 'limit=200' \
            "https://api.appstoreconnect.apple.com/v1/inAppPurchasePriceSchedules/$iap_id/manualPrices" \
            -o "$iap_price_response"
          ruby -rbigdecimal -rdate -rjson -e '
            document = JSON.parse(File.read(ARGV[0]))
            points = document.fetch("included", []).to_h do |resource|
              [resource.fetch("id"), resource.fetch("attributes").fetch("customerPrice")]
            end
            today = Date.today
            active = document.fetch("data").filter_map do |price|
              attributes = price.fetch("attributes")
              starts = attributes["startDate"] && Date.iso8601(attributes["startDate"])
              ends = attributes["endDate"] && Date.iso8601(attributes["endDate"])
              next if starts && starts > today
              next if ends && ends < today
              point_id = price.dig("relationships", "inAppPurchasePricePoint", "data", "id")
              [starts || Date.new(1, 1, 1), points.fetch(point_id)]
            end
            abort "No active U.S. Remove Ads price is configured." if active.empty?
            current = active.max_by(&:first).last
            expected = ENV.fetch("REMOVE_ADS_US_PRICE")
            abort "Remove Ads U.S. price is #{current}, expected #{expected}." unless BigDecimal(current) == BigDecimal(expected)
          ' "$iap_price_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode "filter[app]=$APP_STORE_ID" \
            --data-urlencode "filter[version]=$MARKETING_VERSION" \
            --data-urlencode 'filter[platform]=IOS' \
            --data-urlencode 'limit=1' \
            'https://api.appstoreconnect.apple.com/v1/preReleaseVersions' \
            -o "$prerelease_response"

          prerelease_id="$(ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Multiple prerelease records unexpectedly matched." if data.length > 1
            puts(data.empty? ? "" : data.first.fetch("id"))
          ' "$prerelease_response")"

          : > "$build_versions"
          if [[ -n "$prerelease_id" ]]; then
            build_url="https://api.appstoreconnect.apple.com/v1/builds"
            first_page=1
            while [[ -n "$build_url" ]]; do
              if (( first_page )); then
                curl --fail-with-body --silent --show-error --get \
                  -H "$authorization" \
                  --data-urlencode "filter[preReleaseVersion]=$prerelease_id" \
                  --data-urlencode 'limit=200' \
                  "$build_url" -o "$build_page"
                first_page=0
              else
                curl --fail-with-body --silent --show-error \
                  -H "$authorization" "$build_url" -o "$build_page"
              fi
              ruby -rjson -e '
                JSON.parse(File.read(ARGV[0])).fetch("data").each do |build|
                  puts build.fetch("attributes").fetch("version")
                end
              ' "$build_page" >> "$build_versions"
              build_url="$(ruby -rjson -e '
                puts JSON.parse(File.read(ARGV[0])).fetch("links").fetch("next", "").to_s
              ' "$build_page")"
            done
          fi

          build_number="$(ruby -e '
            versions = File.readlines(ARGV[0], chomp: true).reject(&:empty?)
            parse = lambda do |value|
              abort "Invalid existing App Store build number: #{value}" unless value.match?(/\A[1-9][0-9]{0,3}(?:\.[0-9]{1,2}){0,2}\z/)
              value.split(".").map(&:to_i)
            end
            if versions.empty?
              puts "1"
              exit
            end
            latest = versions.max_by { |value| parse.call(value) + [0] * (3 - parse.call(value).length) }
            parts = parse.call(latest)
            case parts.length
            when 1
              parts[0] += 1
            when 2
              if parts[1] < 99
                parts[1] += 1
              else
                parts = [parts[0] + 1]
              end
            when 3
              if parts[2] < 99
                parts[2] += 1
              elsif parts[1] < 99
                parts = [parts[0], parts[1] + 1]
              else
                parts = [parts[0] + 1]
              end
            end
            abort "No valid higher Apple build number remains." if parts[0] > 9999
            puts parts.join(".")
          ' "$build_versions")"
          [[ "$build_number" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]]
          if [[ "$build_number" != "$EXPECTED_BUILD_NUMBER" ]]; then
            echo "App Store next build is $build_number, but the owner authorized only build $EXPECTED_BUILD_NUMBER." >&2
            exit 1
          fi
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          unset jwt authorization
          echo "App Store identity and bundle registration verified; next build is $build_number."

      - name: Assemble and configure the reviewed application
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(shasum -a 256 "$SOURCE_ZIP" | awk '{print $1}')"
          if [[ "$actual_sha" != "$SOURCE_ZIP_SHA256" ]]; then
            echo "Frozen native source archive digest mismatch." >&2
            exit 1
          fi

          extraction_root="$RUNNER_TEMP/latest-ios-source"
          mkdir -p "$extraction_root"
          /usr/bin/ditto -x -k "$SOURCE_ZIP" "$extraction_root"
          app_root="$extraction_root/grocery-benefits-tracker"
          test -f "$app_root/ios/$SCHEME.xcodeproj/project.pbxproj"

          cp release-overlay/App.tsx "$app_root/App.tsx"
          cp release-overlay/app.html "$app_root/app.html"
          cp release-overlay/app.config.js "$app_root/app.config.js"
          cp release-overlay/package.json "$app_root/package.json"
          cp release-overlay/package-lock.json "$app_root/package-lock.json"
          cp release-overlay/ios/AppDelegate.swift \
            "$app_root/ios/$SCHEME/AppDelegate.swift"
          cp release-overlay/ios/skadnetwork-ids.txt \
            "$app_root/ios/skadnetwork-ids.txt"
          cp release-overlay/ios/en.lproj/InfoPlist.strings \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings"
          cp release-overlay/ios/es-PR.lproj/InfoPlist.strings \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"
          cp release-overlay/assets/app-icon.png.base64 \
            "$app_root/assets/app-icon.png.base64"
          cp release-overlay/assets/brand-logo-ui.png \
            "$app_root/assets/brand-logo-ui.png"
          cp release-overlay/assets/brand-logo-master.jpeg \
            "$app_root/assets/brand-logo-master.jpeg"
          cp release-overlay/scripts/embed-web-app.mjs \
            "$app_root/scripts/embed-web-app.mjs"
          cp release-overlay/scripts/configure-ios-production.sh \
            "$app_root/scripts/configure-ios-production.sh"
          cp release-overlay/scripts/verify-test-release.mjs \
            "$app_root/scripts/verify-test-release.mjs"
          cp release-overlay/scripts/finalize-ios-notices.mjs \
            "$app_root/scripts/finalize-ios-notices.mjs"
          cp release-overlay/scripts/verify-ios-privacy-manifests.mjs \
            "$app_root/scripts/verify-ios-privacy-manifests.mjs"
          test -d "$app_root/tests"
          cp release-overlay/tests/App.ui.test.tsx \
            "$app_root/tests/App.ui.test.tsx"

          test -d "$app_root/src"
          rm -f "$app_root/src/billing.ts"
          test ! -e "$app_root/src/billing.ts"
          cp release-overlay/src/removeAdsPurchase.ts \
            "$app_root/src/removeAdsPurchase.ts"

          cd "$app_root"
          node scripts/embed-web-app.mjs app.html src/appHtml.ts
          bash scripts/configure-ios-production.sh "$app_root"

          plist_path="$app_root/ios/$SCHEME/Info.plist"
          project_path="$app_root/ios/$SCHEME.xcodeproj/project.pbxproj"
          plist_buddy=/usr/libexec/PlistBuddy

          "$plist_buddy" -c "Set :CFBundleDisplayName Grocery Benefits Tracker" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleName Grocery Benefits Tracker" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $IOS_BUNDLE_ID" "$plist_path"
          /usr/bin/sed -i '' \
            's/CFBundleDisplayName = .*/CFBundleDisplayName = "Grocery Benefits Tracker";/' \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings"
          /usr/bin/sed -i '' \
            's/CFBundleDisplayName = .*/CFBundleDisplayName = "Rastreador de Beneficios";/' \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"
          /usr/bin/plutil -lint \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings" \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"
          grep -Fxq 'CFBundleDisplayName = "Grocery Benefits Tracker";' \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings"
          grep -Fxq 'CFBundleDisplayName = "Rastreador de Beneficios";' \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"

          developer_signing='"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";'
          if [[ "$(grep -Fc "$developer_signing" "$project_path")" != "2" ]]; then
            echo "Expected exactly two frozen iPhone Developer signing identities." >&2
            exit 1
          fi

          /usr/bin/sed -i '' \
            -e 's/com\.goodusestudios\.snapebtgrocerytracker\.qa/com.lateefrazaqoyetola.snapebtwictracker/g' \
            -e '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/d' \
            "$project_path"

          bundle_id_pattern='^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = ("com\.lateefrazaqoyetola\.snapebtwictracker"|com\.lateefrazaqoyetola\.snapebtwictracker);$'
          bundle_id_count="$(grep -Ec "$bundle_id_pattern" "$project_path" || true)"
          if [[ "$bundle_id_count" != "2" ]]; then
            echo "Expected the App Store bundle ID in exactly two build configurations; found $bundle_id_count." >&2
            grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$project_path" >&2 || true
            exit 1
          fi
          if grep -Fq 'com.goodusestudios.snapebtgrocerytracker.qa' "$project_path"; then
            echo "The obsolete QA bundle ID remains in the Xcode project." >&2
            exit 1
          fi
          if grep -Fq 'CODE_SIGN_IDENTITY' "$project_path"; then
            echo "An explicit code-signing identity remains in the Xcode project." >&2
            exit 1
          fi

          echo "APP_ROOT=$app_root" >> "$GITHUB_ENV"

      - name: Install locked JavaScript dependencies and verify release gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          npm ci --no-audit --no-fund
          mkdir -p ../legal-pages-final
          npm run generate:notices
          grep -Fq -- 'expo-iap@5.2.4' THIRD_PARTY_NOTICES.txt
          grep -Fq -- 'expo-iap@5.2.4' src/thirdPartyNotices.ts
          grep -Fq -- 'expo-tracking-transparency@57.0.1' THIRD_PARTY_NOTICES.txt
          grep -Fq -- 'expo-tracking-transparency@57.0.1' src/thirdPartyNotices.ts
          npm run typecheck
          npm run test:logic
          npm run test:ui
          node scripts/verify-test-release.mjs

      - name: Install iOS dependencies
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          cd "$APP_ROOT/ios"
          pod install --repo-update
          grep -Fq 'ExpoIap (5.2.4)' Podfile.lock
          grep -Fq 'openiap (3.1.1)' Podfile.lock
          grep -Fq 'ExpoTrackingTransparency (57.0.1)' Podfile.lock
          grep -Fq 'Google-Mobile-Ads-SDK (13.5.0)' Podfile.lock
          grep -Fq 'GoogleUserMessagingPlatform (3.1.0)' Podfile.lock
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$APP_ROOT/ios/$SCHEME/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --report "$RUNNER_TEMP/privacy-manifest-installed.json"
          node "$APP_ROOT/scripts/finalize-ios-notices.mjs"
          grep -Fq 'iOS CocoaPods acknowledgements' "$APP_ROOT/THIRD_PARTY_NOTICES.txt"
          grep -Fqi 'openiap' "$APP_ROOT/src/thirdPartyNotices.ts"
          grep -Fqi 'expo-tracking-transparency' "$APP_ROOT/src/thirdPartyNotices.ts"

      - name: Archive and validate packaged production app
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Grocery-Benefits-Tracker.xcarchive"
          set -o pipefail
          xcodebuild \
            -workspace "$APP_ROOT/ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive | xcbeautify

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 \
            -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info="$(codesign -dvv "$app_path" 2>&1)"
          grep -Fq 'Signature=adhoc' <<< "$signature_info"

          plist="$app_path/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$plist")" == "$ADMOB_PRODUCTION_APP_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :GADDelayAppMeasurementInit' "$plist")" == "true" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$plist")" == "Your permission allows this app and its advertising partners to use a device identifier to measure non-personalized ads. Denying permission does not limit app features." ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" == "Grocery Benefits Tracker" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" == "Grocery Benefits Tracker" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' "$app_path/PrivacyInfo.xcprivacy")" == "false" ]]
          if /usr/libexec/PlistBuddy -c 'Print :NSPrivacyTrackingDomains' \
            "$app_path/PrivacyInfo.xcprivacy" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Print :NSPrivacyCollectedDataTypes' \
            "$app_path/PrivacyInfo.xcprivacy" >/dev/null 2>&1; then
            echo "The packaged app manifest duplicates SDK privacy declarations." >&2
            exit 1
          fi
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$app_path/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --bundle-root "$app_path" \
            --report "$RUNNER_TEMP/privacy-manifest-packaged.json"
          legacy_identity_pattern="SNAP & EBT Grocery Tracker QA|SNAP-EBT & WIC Benefits Tracker|SNAP-EBT WIC Tracker"
          while IFS= read -r metadata_file; do
            if /usr/bin/plutil -convert xml1 -o - "$metadata_file" 2>/dev/null | \
              grep -Eiq "$legacy_identity_pattern"; then
              echo "Legacy public identity remains in packaged metadata: $metadata_file" >&2
              exit 1
            fi
          done < <(find "$app_path" -type f \( -name "*.plist" -o -name "*.strings" \) -print)
          # The Google Mobile Ads module contains its built-in TestIds constant
          # even when the reviewed runtime branch selects only the live unit.
          # Require the live ID; source tests and packaged Info.plist checks
          # verify the production fail-closed selection and publisher ownership.
          grep -aFq "$ADMOB_PRODUCTION_BANNER_ID" "$app_path/main.jsbundle"
          grep -aFq 'requestNonPersonalizedAdsOnly' "$app_path/main.jsbundle"

      - name: Retain packaged privacy-manifest inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-${{ env.BUILD_NUMBER }}-packaged-privacy-manifest-inventory
          path: ${{ runner.temp }}/privacy-manifest-packaged.json
          if-no-files-found: error
          retention-days: 90

      - name: Export and upload production build
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing encrypted GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/Grocery-Benefits-Tracker.xcarchive"
          export_path="$RUNNER_TEMP/app-store-upload"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cleanup() {
            rm -f "$key_path" "$export_options"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY
          chmod 600 "$key_path"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$key_path"
          grep -Fq -- '-----END PRIVATE KEY-----' "$key_path"
          test -d "$archive_path"

          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify

      - name: Record upload result
        shell: bash
        run: |
          {
            echo "## Production App Store Connect upload complete"
            echo
            echo "- App Store ID: $APP_STORE_ID"
            echo "- Bundle ID: $IOS_BUNDLE_ID"
            echo "- Version: $MARKETING_VERSION ($BUILD_NUMBER)"
            echo "- Owner-authorized build: $BUILD_NUMBER"
            echo "- Ads: reviewed live AdMob IDs; non-personalized treatment forced; ATT resolved before SDK initialization"
            echo "- Distribution: App Store Connect production candidate; not submitted for review by this workflow"
            echo
            echo "Wait for Apple processing, review the packaged privacy-manifest inventory, then select this build for version 1.0."
          } >> "$GITHUB_STEP_SUMMARY"
